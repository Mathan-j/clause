services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: clause
      POSTGRES_PASSWORD: clause
      POSTGRES_DB: clause
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clause"]
      interval: 5s
      timeout: 3s
      retries: 10
