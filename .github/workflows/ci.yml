# .github/workflows/ci.yml
name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clause
          POSTGRES_PASSWORD: clause
          # CI never runs `make ingest`; the only database it needs is the one the
          # test suite builds and tears down via Alembic. Named clause_test, not
          # clause, so it can never be mistaken for (or collide with) the
          # application database an engineer's own .env points at.
          POSTGRES_DB: clause_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clause"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python -c "import importlib.util, sys; sys.exit(0 if importlib.util.find_spec('llama_cpp') is None else 1)"
        # Phase 3's answering path depends on llama-cpp-python, but only via the
        # optional `answer` extra (pyproject.toml), never the base install --
        # it is a C++ extension this CI does not build. If that dependency is
        # ever moved into the base install by mistake, `uv sync --frozen` above
        # would start trying to compile it here, and the resulting failure
        # would not obviously point at "someone moved a dependency" as the
        # cause. This assertion turns that into a clear, immediate failure.
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
        env:
          CLAUSE_TEST_DATABASE_URL: postgresql+psycopg://clause:clause@localhost:5432/clause_test
      - run: uv run python -m clause.cli gate
        env:
          # Same Postgres service the test suite uses above, pointed at the same
          # `clause_test` database name (not a separate `clause` database, which
          # this service never creates). `make ingest` never runs in CI, so by the
          # time this step runs, the pytest step's own db_session fixture has left
          # this schema torn down to nothing (its last use downgrades to `base`) --
          # there is no corpus here to count.
          #
          # The gate tolerates that: `clause.cli._gate_chunk_counts` falls back to
          # the committed report's own chunk_counts and prints why, so the
          # chunk-count half of the fingerprint check is visibly skipped rather
          # than silently comparing reports/eval.json to itself. Every other
          # fingerprint field (manifest hash, golden set hash, embedding model,
          # retrieval depth) and the recall@5-vs-baseline check are real checks
          # against the committed artifact -- CI is checking that artifact's
          # internal consistency and the baseline, not recomputing the corpus.
          CLAUSE_DATABASE_URL: postgresql+psycopg://clause:clause@localhost:5432/clause_test
