<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clause — span-level citations over RBI circulars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500&display=swap">
<style>
  :root {
    --bg:        #0D1217;
    --panel:     #151D25;
    --panel-2:   #1B242E;
    --line:      #26323D;
    --text:      #E4EBF2;
    --dim:       #8595A5;
    --faint:     #5A6875;
    --accent:    #FFC857;
    --accent-dk: #7A5E1A;
    --ok:        #3DD68C;
    --stop:      #F16A6A;
    --paper:     #FBFAF7;
    --paper-ink: #1A1D21;

    --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    --serif: "IBM Plex Serif", Georgia, serif;
  }
  * { box-sizing: border-box; }
  /* an explicit display on main/#evidence beats the hidden attribute's default,
     so the toggle needs to win explicitly */
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 15px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  header {
    border-bottom: 1px solid var(--line); padding: 14px 22px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    background: var(--panel);
  }
  .brand { font-family: var(--mono); font-weight: 600; font-size: 15px; letter-spacing: -0.02em; }
  .brand span { color: var(--accent); }
  .tagline { color: var(--dim); font-size: 13px; }
  .health { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .stat { font-family: var(--mono); font-size: 11px; color: var(--faint); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 4px; padding: 5px 10px; line-height: 1.3; }
  .stat b { display: block; color: var(--text); font-size: 14px; font-weight: 600; letter-spacing: -.01em; }

  .tabs { display: flex; gap: 2px; margin-left: 20px; }
  .tabs button { background: transparent; border: 0; border-bottom: 2px solid transparent;
    color: var(--faint); font-family: var(--mono); font-size: 12px; letter-spacing: .06em;
    text-transform: uppercase; padding: 8px 12px; cursor: pointer; }
  .tabs button:hover { color: var(--dim); }
  .tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }

  .filters { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 12px;
    padding-top: 12px; border-top: 1px solid var(--line); }
  .filters label { font-family: var(--mono); font-size: 11px; color: var(--faint);
    text-transform: uppercase; letter-spacing: .08em; }
  .filters select, .filters input[type=date] {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 4px; padding: 5px 8px; font-family: var(--mono); font-size: 12px; }

  /* evidence view */
  #evidence { padding: 26px 30px; overflow-y: auto; }
  #evidence h2 { font-size: 15px; font-family: var(--mono); text-transform: uppercase;
    letter-spacing: .1em; color: var(--accent); margin: 0 0 6px; font-weight: 600; }
  #evidence .note { color: var(--dim); font-size: 14px; margin: 0 0 20px; max-width: 76ch; line-height: 1.6; }
  #evidence section { margin-bottom: 38px; }
  table.ev { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.ev th { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase;
    letter-spacing: .08em; color: var(--faint); font-weight: 600; text-align: right;
    padding: 8px 10px; border-bottom: 1px solid var(--line); }
  table.ev th:first-child { text-align: left; }
  table.ev td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: right;
    font-variant-numeric: tabular-nums; font-family: var(--mono); }
  table.ev td:first-child { text-align: left; font-family: var(--sans); color: var(--dim); }
  table.ev tr.total td { color: var(--text); font-weight: 600; border-bottom: 0; }
  table.ev .floor { color: var(--accent); }

  .bars { display: grid; gap: 10px; margin-top: 4px; }
  .barrow { display: grid; grid-template-columns: 130px 1fr 74px; gap: 12px; align-items: center; }
  .barrow .nm { font-family: var(--mono); font-size: 12px; color: var(--dim); }
  .track { height: 22px; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 3px; position: relative; overflow: hidden; }
  .track .fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); opacity: .85; }
  .track .floor { position: absolute; top: 0; bottom: 0; background: var(--stop); width: 2px; }
  .barrow .val { font-family: var(--mono); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }

  .sweep { display: grid; grid-template-columns: repeat(auto-fit, minmax(58px, 1fr)); gap: 3px; margin-top: 10px; }
  .sweep div { text-align: center; font-family: var(--mono); font-size: 10px; color: var(--faint); }
  .sweep .col { display: flex; flex-direction: column-reverse; height: 110px; gap: 2px; margin-bottom: 5px; }
  .sweep .a { background: var(--ok); opacity: .8; }
  .sweep .r { background: var(--stop); opacity: .75; }

  main { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); height: calc(100% - 58px); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; height: auto; } }

  .left { padding: 22px; overflow-y: auto; border-right: 1px solid var(--line); }
  .right { padding: 22px; overflow-y: auto; background: var(--bg); }
  @media (max-width: 900px) { .left { border-right: 0; border-bottom: 1px solid var(--line); } }

  label.fieldlabel {
    display: block; font-family: var(--mono); font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--faint); margin-bottom: 8px;
  }

  textarea {
    width: 100%; background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 12px 14px; font-family: var(--sans); font-size: 15px;
    line-height: 1.5; resize: vertical; min-height: 76px;
  }
  textarea:focus { outline: 2px solid var(--accent-dk); outline-offset: 1px; border-color: var(--accent-dk); }

  .row { display: flex; gap: 12px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  button.ask {
    background: var(--accent); color: #241B04; border: 0; border-radius: 6px;
    padding: 10px 20px; font-family: var(--sans); font-weight: 600; font-size: 14px; cursor: pointer;
  }
  button.ask:hover { filter: brightness(1.08); }
  button.ask:disabled { opacity: .5; cursor: default; filter: none; }

  .thresh { display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 12px; color: var(--dim); }
  .thresh input { accent-color: var(--accent); width: 128px; }
  .thresh output { color: var(--accent); font-weight: 600; min-width: 34px; }

  .examples { margin-top: 16px; display: flex; flex-direction: column; gap: 6px; }
  .examples button {
    text-align: left; background: transparent; border: 1px solid var(--line); color: var(--dim);
    border-radius: 5px; padding: 8px 11px; font-family: var(--sans); font-size: 13px; cursor: pointer;
  }
  .examples button:hover { border-color: var(--accent-dk); color: var(--text); }
  .examples .tag { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin-right: 8px; }

  .result { margin-top: 26px; }
  .statusline {
    display: flex; gap: 8px; flex-wrap: wrap;
    border-top: 1px solid var(--line); padding-top: 14px; margin-bottom: 18px;
  }
  .statusline .stat { background: transparent; }
  .statusline .stat.key b { color: var(--accent); }
  .waiting { font-family: var(--mono); font-size: 12.5px; color: var(--dim);
    display: flex; align-items: center; gap: 10px; padding: 14px 0 4px; }
  .waiting .note { color: var(--faint); font-size: 11.5px; }

  .verdict { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px;
    text-transform: uppercase; letter-spacing: .1em; padding: 5px 10px; border-radius: 4px; margin-bottom: 16px; }
  .verdict.answered { background: rgba(61,214,140,.12); color: var(--ok); }
  .verdict.refused  { background: rgba(241,106,106,.12); color: var(--stop); }
  .verdict.failed   { background: rgba(241,106,106,.18); color: var(--stop); }

  .sentence { margin-bottom: 14px; display: flex; gap: 10px; align-items: flex-start; }
  .sentence p { margin: 0; }
  .chip {
    flex: none; font-family: var(--mono); font-size: 11px; font-weight: 600;
    background: var(--panel-2); color: var(--accent); border: 1px solid var(--accent-dk);
    border-radius: 4px; padding: 2px 7px; cursor: pointer; margin-top: 3px;
  }
  .chip:hover { background: var(--accent); color: #241B04; }
  .chip.active { background: var(--accent); color: #241B04; }
  .chip.none { color: var(--faint); border-color: var(--line); cursor: default; background: transparent; }

  .refusebox { border: 1px solid var(--line); border-left: 3px solid var(--stop); border-radius: 5px; padding: 14px 16px; background: var(--panel); }
  .refusebox p { margin: 0 0 8px; }
  .refusebox p:last-child { margin: 0; color: var(--dim); font-size: 13.5px; }

  /* right panel: the document */
  .placeholder { color: var(--faint); font-size: 14px; border: 1px dashed var(--line); border-radius: 6px; padding: 30px 22px; text-align: center; }
  .docmeta { font-family: var(--mono); font-size: 11.5px; color: var(--faint); margin-bottom: 12px; display: flex; gap: 14px; flex-wrap: wrap; }
  .docmeta a { color: var(--accent); }
  .doctitle { font-size: 16px; font-weight: 600; margin: 0 0 4px; line-height: 1.35; }
  .spanlabel { font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: .06em; margin-bottom: 8px; }
  .posbar { height: 6px; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 3px; margin-bottom: 14px; position: relative; overflow: hidden; }
  .posbar i { position: absolute; top: 0; bottom: 0; background: var(--accent); border-radius: 2px; min-width: 2px; }
  .ctx { opacity: .45; }

  .paper {
    background: var(--paper); color: var(--paper-ink); border-radius: 6px; padding: 24px 26px;
    font-family: var(--serif); font-size: 14.5px; line-height: 1.8; white-space: pre-wrap;
    word-wrap: break-word; max-height: calc(100vh - 230px); overflow-y: auto;
  }
  .paper mark { background: var(--accent); color: #241B04; padding: 1px 0; box-shadow: 0 0 0 3px var(--accent); border-radius: 1px; }
  .limits { margin-top: 22px; border: 1px solid var(--line); border-left: 3px solid var(--stop);
    border-radius: 5px; padding: 14px 16px; background: var(--panel); }
  .limits h4 { margin: 0 0 8px; font-family: var(--mono); font-size: 10.5px; text-transform: uppercase;
    letter-spacing: .12em; color: var(--stop); font-weight: 600; }
  .limits p { margin: 0 0 6px; font-size: 13.5px; color: var(--dim); line-height: 1.55; }
  .limits p:last-child { margin: 0; }
  .limits b { color: var(--text); font-family: var(--mono); }

  .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid var(--accent-dk); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
</style>
</head>
<body>

<header>
  <div class="brand">clause<span>.</span></div>
  <div class="tagline">every factual sentence resolves to an exact character span</div>
  <div class="tabs">
    <button id="tabAsk" class="on">ask</button>
    <button id="tabEv">evidence</button>
  </div>
  <div class="health" id="health"></div>
</header>

<main id="askView">
  <div class="left">
    <label class="fieldlabel" for="q">Ask about RBI KYC / AML rules</label>
    <textarea id="q" placeholder="e.g. What must a regulated entity do when a customer's KYC records are due for periodic updation?"></textarea>

    <div class="row">
      <button class="ask" id="askBtn">Ask</button>
      <div class="thresh">
        <label for="th">refusal threshold</label>
        <input type="range" id="th" min="0" max="0.95" step="0.05" value="0.35">
        <output id="thv">0.35</output>
      </div>
    </div>

    <div class="filters">
      <label for="strat">chunking</label>
      <select id="strat">
        <option value="structural">structural</option>
        <option value="fixed_window">fixed_window</option>
      </select>
      <label for="after">published after</label>
      <input type="date" id="after">
      <label for="ent">entity</label>
      <select id="ent"><option value="">any</option></select>
    </div>

    <div class="examples" id="examples">
      <button data-q="What must a regulated entity do when a customer's KYC records are due for periodic updation?"><span class="tag">answerable</span>Periodic KYC updation</button>
      <button data-q="What is the minimum capital conservation buffer a scheduled commercial bank must maintain under Basel III?"><span class="tag">out of corpus</span>Capital adequacy — not in these documents</button>
      <button data-q="What are the record retention requirements for customer identification data?"><span class="tag">answerable</span>Record retention</button>
    </div>

    <div class="result" id="result"></div>
    <div id="limits"></div>
  </div>

  <div class="right" id="right">
    <div class="placeholder">Ask a question, then click a citation chip to see the exact characters it came from, highlighted in the source document.</div>
  </div>
</main>

<div id="evidence" hidden></div>

<script>
const $ = s => document.querySelector(s);
const q = $("#q"), askBtn = $("#askBtn"), th = $("#th"), thv = $("#thv");
const resultEl = $("#result"), rightEl = $("#right");
let citations = [], docCache = {};

th.addEventListener("input", () => { thv.textContent = Number(th.value).toFixed(2); });
document.querySelectorAll("#examples button").forEach(b =>
  b.addEventListener("click", () => { q.value = b.dataset.q; ask(); }));
askBtn.addEventListener("click", ask);
q.addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) ask(); });

fetch("/api/health").then(r => r.json()).then(h => {
  $("#health").innerHTML =
    `<div class="stat">documents<b>${h.documents}</b></div>` +
    `<div class="stat">chunking<b>${h.strategy}</b></div>` +
    `<div class="stat">model<b>${h.model.replace(/\.gguf$/, "")}</b></div>`;
}).catch(() => {});

fetch("/api/limitations").then(r => r.json()).then(L => {
  if (!L.measured) return;
  $("#limits").innerHTML =
    `<div class="limits">
      <h4>measured limitation</h4>
      <p>At the default threshold of <b>${Number(L.threshold).toFixed(2)}</b>, the refusal gate
         caught <b>${L.adversarial_refused} of ${L.adversarial_total}</b> deliberately
         unanswerable questions, while turning away <b>${L.false_refusals}</b> answerable ones.</p>
      <p>A retrieval score does not separate answerable from unanswerable. Raising the bar
         far enough to refuse the bad questions also refuses the good ones.</p>
      <p>From the committed <b>reports/answers.md</b>; this panel shows nothing when no run is committed.</p>
    </div>`;
}).catch(() => {});

function esc(s) { return s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

async function ask() {
  const question = q.value.trim();
  if (!question) return;
  askBtn.disabled = true;
  const t0 = Date.now();
  resultEl.innerHTML = `<div class="waiting"><span class="spinner"></span>
      <span>retrieving, then generating locally &mdash; <b id="el">0.0</b>s</span></div>
    <div class="waiting"><span class="note">a 3B model on CPU; typically 60&ndash;90s. A refusal returns instantly, because it never calls the model.</span></div>`;
  const tick = setInterval(() => {
    const e = document.getElementById("el");
    if (e) e.textContent = ((Date.now() - t0) / 1000).toFixed(1);
  }, 100);
  try {
    const res = await fetch("/api/ask", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        question,
        threshold: Number(th.value),
        strategy: $("#strat").value,
        published_after: $("#after").value || null,
        entities: $("#ent").value ? [$("#ent").value] : null
      })
    });
    render(await res.json());
  } catch (e) {
    resultEl.innerHTML = `<div class="verdict failed">request failed</div><p>${esc(String(e))}</p>`;
  } finally { clearInterval(tick); askBtn.disabled = false; }
}

function statusline(d) {
  const bits = [];
  if (d.top_score != null) bits.push(`<div class="stat key">top score<b>${d.top_score.toFixed(3)}</b></div>`);
  if (d.threshold != null) bits.push(`<div class="stat">threshold<b>${Number(d.threshold).toFixed(2)}</b></div>`);
  if (d.timing_ms?.retrieval != null) bits.push(`<div class="stat">retrieval<b>${d.timing_ms.retrieval}ms</b></div>`);
  if (d.timing_ms?.total != null) bits.push(`<div class="stat">total<b>${(d.timing_ms.total/1000).toFixed(1)}s</b></div>`);
  return `<div class="statusline">${bits.join("")}</div>`;
}

function render(d) {
  citations = d.citations || [];
  if (d.kind === "refusal") {
    resultEl.innerHTML = statusline(d) +
      `<div class="verdict refused">refused</div>
       <div class="refusebox">
         <p>No answer given. Retrieval was not strong enough to support one.</p>
         <p>Top score ${d.top_score == null ? "—" : d.top_score.toFixed(3)} fell below the threshold of ${Number(d.threshold).toFixed(2)}${d.reason === "no_candidates" ? " — nothing was retrieved at all" : ""}. The system refuses rather than answering from weak evidence.</p>
       </div>`;
    rightEl.innerHTML = `<div class="placeholder">Nothing cited — the question was refused.</div>`;
    return;
  }
  if (d.kind === "contract_failure") {
    resultEl.innerHTML = statusline(d) +
      `<div class="verdict failed">citation contract failure</div>
       <div class="refusebox">
         <p>An answer was generated but <strong>withheld</strong>: its citations did not resolve against the corpus.</p>
         <p><code>${esc(d.error_type)}</code> — ${esc(d.detail)}</p>
       </div>`;
    rightEl.innerHTML = `<div class="placeholder">No answer was released, so there is nothing to show.</div>`;
    return;
  }

  const sentences = (d.sentences || []).map(s => {
    const chips = (s.citation_indices || []).length
      ? s.citation_indices.map(i => `<button class="chip" data-i="${i}">${i}</button>`).join("")
      : `<span class="chip none">—</span>`;
    return `<div class="sentence">${chips}<p>${esc(s.text)}</p></div>`;
  }).join("");

  resultEl.innerHTML = statusline(d) +
    `<div class="verdict answered">answered · ${citations.length} citation${citations.length === 1 ? "" : "s"} resolved</div>` +
    sentences;

  resultEl.querySelectorAll(".chip[data-i]").forEach(c =>
    c.addEventListener("click", () => showCitation(Number(c.dataset.i), c)));

  if (citations.length) showCitation(1, resultEl.querySelector('.chip[data-i="1"]'));
}

async function showCitation(i, chipEl) {
  const c = citations[i - 1];
  if (!c) return;
  resultEl.querySelectorAll(".chip").forEach(x => x.classList.remove("active"));
  resultEl.querySelectorAll(`.chip[data-i="${i}"]`).forEach(x => x.classList.add("active"));

  rightEl.innerHTML = `<div class="placeholder"><span class="spinner"></span> loading ${esc(c.doc_id)}…</div>`;
  let doc = docCache[c.doc_id];
  if (!doc) {
    doc = await (await fetch(`/api/document/${encodeURIComponent(c.doc_id)}`)).json();
    docCache[c.doc_id] = doc;
  }

  const pre = doc.text.slice(Math.max(0, c.char_start - 900), c.char_start);
  const span = doc.text.slice(c.char_start, c.char_end);
  const post = doc.text.slice(c.char_end, c.char_end + 900);

  const total = doc.text.length || 1;
  const leftPct = (c.char_start / total) * 100;
  const widthPct = Math.max(((c.char_end - c.char_start) / total) * 100, 0.6);

  rightEl.innerHTML =
    `<p class="doctitle">${esc(doc.title)}</p>
     <div class="docmeta">
       <span>${esc(doc.doc_id)}</span>
       <span>${esc(doc.doc_type)}</span>
       <span>${esc(doc.published_date)}</span>
       <a href="${esc(doc.url)}" target="_blank" rel="noopener">source ↗</a>
     </div>
     <div class="spanlabel">characters ${c.char_start.toLocaleString()} – ${c.char_end.toLocaleString()} of ${total.toLocaleString()}</div>
     <div class="posbar" title="where this citation falls in the document"><i style="left:${leftPct}%;width:${widthPct}%"></i></div>
     <div class="paper" id="paper"><span class="ctx">${pre ? "…" : ""}${esc(pre)}</span><mark id="hl">${esc(span)}</mark><span class="ctx">${esc(post)}${post ? "…" : ""}</span></div>`;

  const hl = document.getElementById("hl");
  if (hl) hl.scrollIntoView({ block: "center", behavior: "smooth" });
}

// ---- tabs -------------------------------------------------------------
const askView = document.getElementById("askView");
const evView  = document.getElementById("evidence");
let evidenceLoaded = false;

function show(which) {
  const isAsk = which === "ask";
  askView.hidden = !isAsk;
  evView.hidden = isAsk;
  $("#tabAsk").classList.toggle("on", isAsk);
  $("#tabEv").classList.toggle("on", !isAsk);
  if (!isAsk && !evidenceLoaded) { evidenceLoaded = true; loadEvidence(); }
}
$("#tabAsk").addEventListener("click", () => show("ask"));
$("#tabEv").addEventListener("click", () => show("evidence"));

// ---- filters ----------------------------------------------------------
fetch("/api/entities").then(r => r.json()).then(d => {
  const sel = $("#ent");
  (d.entities || []).forEach(e => {
    const o = document.createElement("option");
    o.value = e; o.textContent = e; sel.appendChild(o);
  });
}).catch(() => {});

// ---- evidence ---------------------------------------------------------
function pct(x) { return (x * 100).toFixed(0) + "%"; }

async function loadEvidence() {
  evView.innerHTML = `<p class="note"><span class="spinner"></span> loading committed reports…</p>`;
  let d;
  try { d = await (await fetch("/api/evidence")).json(); }
  catch (e) { evView.innerHTML = `<p class="note">could not load: ${esc(String(e))}</p>`; return; }

  let html = "";

  if (!d.retrieval) {
    html += `<section><h2>retrieval</h2><p class="note">No committed <code>reports/eval.json</code>. Run <code>make eval</code>.</p></section>`;
  } else {
    const R = d.retrieval, cb = R.chance_baseline?.measured || {};
    const names = Object.keys(R.strategies).sort();

    html += `<section>
      <h2>retrieval, measured</h2>
      <p class="note">From the committed <code>reports/eval.json</code>, regenerated by <code>make eval</code>
        and gated in CI. The <span class="floor">chance floor</span> is the probability a random top-5 would
        contain an acceptable span, computed per strategy over the real answer-span counts &mdash; recall
        without it is a bare number.</p>
      <div class="bars">`;

    names.forEach(n => {
      const o = R.strategies[n].overall, floor = (cb[n] || {}).recall_at_5 || 0;
      html += `<div class="barrow">
          <div class="nm">${esc(n)}</div>
          <div class="track">
            <div class="fill" style="width:${pct(o.recall_at_5)}"></div>
            <div class="floor" style="left:${pct(floor)}" title="chance floor ${floor.toFixed(3)}"></div>
          </div>
          <div class="val">${o.recall_at_5.toFixed(3)}</div>
        </div>`;
    });
    html += `</div>
      <p class="note" style="margin-top:14px">Bar is recall@5; the red mark is that strategy's chance floor.
        The two rankings disagree &mdash; <code>fixed_window</code> leads on raw recall, <code>structural</code>
        is ahead against its own floor. Its lead is partly mechanical: a 200-character overlap duplicates text,
        giving it more acceptable chunks per question.</p>
    </section>`;

    names.forEach(n => {
      const S = R.strategies[n], buckets = Object.keys(S.per_bucket).sort();
      html += `<section><h2>${esc(n)} &mdash; per bucket</h2><table class="ev">
        <thead><tr><th>bucket</th><th>n</th><th>recall@1</th><th>recall@5</th><th>recall@10</th><th>MRR@10</th></tr></thead><tbody>`;
      buckets.forEach(b => {
        const r = S.per_bucket[b];
        html += `<tr><td>${esc(b)}</td><td>${r.n}</td><td>${r.recall_at_1.toFixed(2)}</td>
                 <td>${r.recall_at_5.toFixed(2)}</td><td>${r.recall_at_10.toFixed(2)}</td>
                 <td>${r.mrr_at_10.toFixed(3)}</td></tr>`;
      });
      const o = S.overall;
      html += `<tr class="total"><td>overall</td><td>${o.n}</td><td>${o.recall_at_1.toFixed(2)}</td>
               <td>${o.recall_at_5.toFixed(2)}</td><td>${o.recall_at_10.toFixed(2)}</td>
               <td>${o.mrr_at_10.toFixed(3)}</td></tr></tbody></table>
        <p class="note" style="margin-top:10px">About 16 questions per bucket, so one question moves a bucket by ~6 points.</p></section>`;
    });
  }

  if (!d.answering) {
    html += `<section><h2>answering &amp; refusal</h2>
      <p class="note">No committed <code>reports/answers.json</code> yet. Nothing is shown rather than a
      remembered figure &mdash; every number on this page comes from a committed artifact.</p></section>`;
  } else {
    const A = d.answering, sweep = A.sweep || [];
    html += `<section><h2>refusal threshold sweep</h2>
      <p class="note">Green is golden questions answered, red is trick questions still answered.
        Raising the bar far enough to refuse the unanswerable ones also refuses the answerable ones.
        There is no setting that separates them &mdash; the approach is measurably wrong.</p>
      <div class="sweep">`;
    sweep.forEach(r => {
      const ansPct = (r.answered / 65) * 100;
      const advPct = ((r.adversarial_answered || 0) / 15) * 100;
      html += `<div>
        <div class="col">
          <div class="a" style="height:${ansPct}%" title="answered ${r.answered}/65"></div>
          <div class="r" style="height:${advPct}%" title="trick answered ${r.adversarial_answered}/15"></div>
        </div>${Number(r.threshold).toFixed(2)}</div>`;
    });
    html += `</div></section>`;
  }

  evView.innerHTML = html;
}

</script>
</body>
</html>
