[project]
name = "clause"
version = "0.1.0"
description = "Regulatory answer engine with span-level citations over RBI circulars"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "optimum[onnxruntime]>=2.1.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "qdrant-client>=1.19.1",
    "selectolax>=0.4.12",
    # Upper bound is load-bearing: sentence-transformers>=6.0.0 requires
    # transformers>=5.0.0, but optimum-onnx (pulled in by optimum[onnxruntime]
    # below, required for backend="onnx") caps transformers<4.58 as of
    # 2026-09-20. Without this bound, `uv lock --upgrade` re-resolves straight
    # into that conflict. Lift it once optimum-onnx supports transformers 5.x.
    "sentence-transformers>=5.7.0,<6.0.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.53.0",
]

[project.optional-dependencies]
answer = ["llama-cpp-python==0.3.19"]

[dependency-groups]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8.3"]

[tool.uv]
extra-index-url = ["https://abetlen.github.io/llama-cpp-python/whl/cpu"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clause"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Alembic-generated scaffolding: env.py's module-level import placement and the
# versions/ revision scripts are Alembic's own template output, not hand-written.
exclude = ["migrations/versions/*", "migrations/env.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Test assertions compare against literal expected values by design.
"tests/**" = ["PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/clause"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers -q"
markers = [
    "db: requires a live Postgres instance",
    "model: requires the embedding model in the local cache",
    "qdrant: requires a live Qdrant instance",
    "llm: requires the GGUF answering model in the local cache",
]
